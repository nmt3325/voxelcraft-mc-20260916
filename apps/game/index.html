<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoxelCraft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e13;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /*
       * The UI subtree renders into #ui-root and owns its own styling: the
       * full-screen `.vc-ui` layer is transparent to the pointer and only the
       * interactive parts (hotbar, menus, touch controls) opt back in with
       * their own `pointer-events: auto`.
       *
       * Do not add `#ui-root > * { pointer-events: auto }` here: an ID rule
       * beats `.vc-ui`, the whole layer becomes a hit target, and the canvas
       * never receives the mousedown that requests pointer lock - mouse look
       * and block breaking die while keyboard movement keeps working.
       */
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
