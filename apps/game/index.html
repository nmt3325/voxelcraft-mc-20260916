<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoxelCraft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e13;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The UI subtree renders into #ui-root and owns its own styling. */
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ui-root > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
